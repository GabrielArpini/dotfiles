add_newline = true
command_timeout = 500
format = "$directory$git_branch$git_status$line_break$character"
[directory]
style = "#8FB8DF"
truncation_length = 3
truncation_symbol = "…/"
[git_branch]
symbol = ""
format = "[on ](#8CA6B5)[$branch ](#BAA0C8)"
[git_status]
style = "#D9BD82"
format = "([$all_status$ahead_behind]($style) )"
[character]
success_symbol = "[❯](#5F919B)"
error_symbol = "[❯](#DB8B79)"
